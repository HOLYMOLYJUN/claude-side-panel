<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: 0 16px 24px; font: 13px/1.6 var(--vscode-font-family); color: var(--vscode-foreground); background: var(--vscode-sideBar-background, var(--vscode-editor-background)); }
  /* 썸네일 확대 효과가 새 층을 만들어도 머리가 늘 위에 오게 한다 */
  header { position: sticky; top: 0; z-index: 5; padding: 12px 0 0; background: var(--vscode-sideBar-background, var(--vscode-editor-background)); }
  .title { font-weight: 600; font-size: 14px; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav { position: relative; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--vscode-panel-border); }
  /* 탭 고르기 버튼과 메뉴 */
  #colbtn { all: unset; flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-bottom: 4px; box-sizing: border-box; border: 1px solid var(--vscode-panel-border); border-radius: 6px; color: var(--vscode-descriptionForeground); cursor: pointer; transition: color .15s, background .15s; }
  #colbtn:hover, #colbtn.on { color: var(--vscode-foreground); background: var(--vscode-list-hoverBackground); }
  #colbtn:focus-visible { outline: 1px solid var(--vscode-focusBorder); }
  #tabmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 200px; padding: 8px 0 4px; background: var(--vscode-editorWidget-background, var(--vscode-editor-background)); border: 1px solid var(--vscode-editorWidget-border, var(--vscode-panel-border)); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .18s ease, transform .22s cubic-bezier(.2, .8, .2, 1); }
  #tabmenu.on { opacity: 1; transform: none; pointer-events: auto; }
  .mh { padding: 2px 14px 6px; font-size: 12px; font-weight: 500; color: var(--vscode-descriptionForeground); }
  .mrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mrow .sw { font-weight: 400; }
  .mnote { margin-top: 4px; font-weight: 400; color: var(--vscode-charts-blue); }
  #tabmenu { min-width: 240px; }
  #tablist { margin: 0; padding: 0; }
  #tablist li { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border: 0; background: var(--vscode-editorWidget-background, var(--vscode-editor-background)); }
  #tablist li:hover { background: var(--vscode-list-hoverBackground); }
  #tablist li.dragging { position: relative; z-index: 1; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  #tablist label { flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #tablist input { width: 16px; height: 16px; margin: 0; accent-color: var(--vscode-button-background); cursor: pointer; }
  #tablist input:disabled { cursor: default; opacity: .5; }
  .grip { flex: none; display: flex; color: var(--vscode-descriptionForeground); cursor: grab; touch-action: none; }
  .mf { margin-top: 4px; padding: 8px 14px 4px; border-top: 1px solid var(--vscode-panel-border); }
  .mf button { all: unset; font-size: 12px; color: var(--vscode-descriptionForeground); cursor: pointer; }
  .mf button:hover { color: var(--vscode-foreground); }
  @media (prefers-reduced-motion: reduce) { #tabmenu, #colbtn { transition: none; } }
  /* 탭이 폭을 넘으면 가로로 밀어 본다. 막대는 숨긴다 */
  #tabs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { touch-action: none; user-select: none; }
  #tabs button.dragging { position: relative; z-index: 1; cursor: grabbing; color: var(--vscode-foreground); background: var(--vscode-list-hoverBackground); border-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  @media (prefers-reduced-motion: reduce) { #tabs button { transition: none !important; } }
  nav button { flex: none; }
  nav button { all: unset; flex: none; white-space: nowrap; cursor: pointer; padding: 6px 10px 8px; font-weight: 500; color: var(--vscode-descriptionForeground); transition: color .2s; }
  nav button.on { color: var(--vscode-foreground); }
  /* 탭 밑줄은 하나만 두고 고른 탭 아래로 미끄러뜨린다 */
  #ind { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; border-radius: 1px; background: var(--vscode-focusBorder); transition: transform .25s cubic-bezier(.2, .8, .2, 1), width .25s cubic-bezier(.2, .8, .2, 1), opacity .15s; }
  @media (prefers-reduced-motion: reduce) { #ind, nav button, nav button .lb, nav button .n { transition: none; } }
  nav .n { margin-left: 6px; display: inline-block; padding: 2px 7px; line-height: 14px; border-radius: 10px; font-size: 11px; vertical-align: 1px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
  main { padding-top: 16px; }
  .muted { color: var(--vscode-descriptionForeground); }
  .bar { height: 6px; border-radius: 3px; background: var(--vscode-editorWidget-border, #8884); overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--vscode-progressBar-background); }
  .bar.warn i { background: var(--vscode-editorWarning-foreground); }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--vscode-panel-border); }
  li:last-child { border-bottom: 0; }
  .ic { flex: none; width: 16px; text-align: center; }
  .done .t { color: var(--vscode-descriptionForeground); }
  .memo { display: block; font-size: 12px; color: var(--vscode-descriptionForeground); }
  .big { font-size: 22px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .badge { flex: none; display: inline-block; font-size: 11px; padding: 2px 8px; line-height: 14px; border-radius: 10px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
  .badge.running { background: var(--vscode-progressBar-background); color: var(--vscode-button-foreground); }
  .badge.failed { background: var(--vscode-inputValidation-errorBackground); color: var(--vscode-foreground); }
  a { color: var(--vscode-textLink-foreground); cursor: pointer; text-decoration: none; word-break: break-all; }
  a:hover { text-decoration: underline; }
  .grow { flex: 1; min-width: 0; }
  h3 { font-size: 12px; font-weight: 600; margin: 20px 0 0; color: var(--vscode-descriptionForeground); }
  .grow .bar, .mini { display: block; margin: 4px 0 2px; }
  .mini { height: 3px; border-radius: 2px; background: var(--vscode-editorWidget-border, #8884); overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--vscode-progressBar-background); }
  .done .mini i { background: var(--vscode-descriptionForeground); }
  .num { flex: none; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .bar.stack { display: flex; height: 10px; border-radius: 4px; }
  .bar.stack i { flex: none; }
  .bar.stack i + i { margin-left: 1px; }
  .bar.stack .buf { margin-left: auto; background: repeating-linear-gradient(135deg, var(--vscode-descriptionForeground) 0 2px, transparent 2px 4px); opacity: .5; }
  li.cx { display: block; }
  /* 펼침 공용: 높이는 grid 0fr→1fr 로 미끄러지고, 함께 페이드 */
  .exp-head { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .exp-body { display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(-6px); transition: grid-template-rows .28s cubic-bezier(.2, .8, .2, 1), opacity .2s ease, transform .28s cubic-bezier(.2, .8, .2, 1); }
  .exp-body > div { overflow: hidden; min-height: 0; }
  .exp.open > .exp-body { grid-template-rows: 1fr; opacity: 1; transform: none; }
  .chev { flex: none; width: 16px; text-align: center; color: var(--vscode-descriptionForeground); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .exp.open .chev { transform: rotate(90deg); }
  /* 결과보고 */
  .rep { padding: 10px 0; border-bottom: 1px solid var(--vscode-panel-border); }
  .rep .md { margin-top: 8px; }
  .peek { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; max-height: 3.2em; font-size: 12px; color: var(--vscode-descriptionForeground); transition: opacity .2s ease, max-height .28s cubic-bezier(.2, .8, .2, 1); }
  .exp.open .peek { opacity: 0; max-height: 0; }
  .unread { flex: none; width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: var(--vscode-charts-blue); }
  .readpad { flex: none; width: 7px; }
  .badge.by { margin-right: 6px; }
  .reptop { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  @media (prefers-reduced-motion: reduce) { .exp-body, .chev, .peek { transition: none; } }
  .one { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cxbody { padding: 4px 0 8px 24px; }
  .turn { margin-top: 10px; }
  .turn .who { font-size: 11px; color: var(--vscode-descriptionForeground); }
  /* Codex 답 마크다운 */
  .md { margin-top: 4px; padding: 10px 12px; border-radius: 4px; background: var(--vscode-textCodeBlock-background); max-height: 420px; overflow: auto; line-height: 1.6; word-break: break-word; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--vscode-foreground); }
  .md p, .md ul, .md ol { margin: 6px 0; }
  .md ul, .md ol { padding-left: 20px; }
  .md li { display: list-item; border: 0; padding: 1px 0; }
  .md strong { font-weight: 600; }
  .md code { font: 12px var(--vscode-editor-font-family); padding: 1px 4px; border-radius: 3px; background: var(--vscode-editor-background); }
  .md pre { background: var(--vscode-editor-background); max-height: none; }
  .md pre code { padding: 0; background: none; }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 12px; width: 100%; }
  .md th, .md td { border: 1px solid var(--vscode-panel-border); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { font-weight: 600; background: var(--vscode-editor-background); }
  .md a { color: var(--vscode-textLink-foreground); }
  .turn.me pre { background: var(--vscode-input-background); }
  .cxsend { margin-top: 12px; }
  .cxsend textarea { width: 100%; box-sizing: border-box; resize: vertical; padding: 6px 8px; font: 13px/1.5 var(--vscode-font-family); color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, transparent); border-radius: 4px; }
  .cxsend textarea:focus { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .cxsend .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .sw { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--vscode-descriptionForeground); cursor: pointer; }
  .send { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 4px; font-weight: 500; background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  .send:hover { background: var(--vscode-button-hoverBackground); }
  .send[disabled], .cxsend textarea[disabled] { opacity: .5; cursor: default; }
  pre { margin: 4px 0 0; padding: 8px; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--vscode-editor-font-family); background: var(--vscode-textCodeBlock-background); border-radius: 4px; max-height: 240px; overflow: auto; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
  @media (min-width: 560px) { ul.cats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; } ul.cats li:last-child { border-bottom: 1px solid var(--vscode-panel-border); } }
  /* 결과물 탭 */
  .out { margin-bottom: 20px; }
  .out .cap { margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .thumb { all: unset; cursor: zoom-in; position: relative; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--vscode-editorWidget-background, #8882); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .thumb:hover img { transform: scale(1.03); }
  .thumb:focus-visible { outline: 2px solid var(--vscode-focusBorder); outline-offset: 2px; }
  .thumb.file, .thumb.gone { display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; text-align: center; font-size: 12px; color: var(--vscode-descriptionForeground); word-break: break-all; }
  .thumb.gone { cursor: default; }
  /* 라이트박스 */
  #lb { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 56px; box-sizing: border-box; background: rgba(0, 0, 0, .85); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #lb.on { opacity: 1; pointer-events: auto; }
  #lb img { max-width: 100%; max-height: calc(100vh - 120px); object-fit: contain; border-radius: 4px; transform: scale(.96); transition: transform .2s; }
  #lb.on img { transform: scale(1); }
  #lb .meta { color: #ddd; font-size: 12px; text-align: center; max-width: 100%; }
  #lb .meta a { color: #9cdcfe; }
  #lb button { all: unset; cursor: pointer; position: absolute; color: #eee; font-size: 22px; width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .1); }
  #lb button:hover { background: rgba(255, 255, 255, .2); }
  #lb .x { top: 12px; right: 12px; font-size: 18px; }
  #lb .prev { left: 8px; top: 50%; transform: translateY(-50%); }
  #lb .next { right: 8px; top: 50%; transform: translateY(-50%); }
  @media (prefers-reduced-motion: reduce) { #lb, #lb img, .thumb img { transition: none; } }
  /* 두 장 비교 */
  .btn2 { all: unset; cursor: pointer; padding: 2px 10px; line-height: 20px; border-radius: 4px; font-size: 12px; border: 1px solid var(--vscode-panel-border); color: var(--vscode-foreground); }
  .btn2:hover { background: var(--vscode-list-hoverBackground); }
  .outtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; min-height: 26px; font-size: 12px; color: var(--vscode-descriptionForeground); }
  .picking .thumb { cursor: pointer; }
  .thumb .pk { position: absolute; top: 6px; left: 6px; padding: 2px 8px; line-height: 14px; border-radius: 10px; font-size: 11px; font-weight: 500; background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  .thumb.picked { outline: 2px solid var(--vscode-focusBorder); outline-offset: 2px; }
  #lb .cmp { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  #lb.cmpmode .cmp { display: flex; }
  #lb.cmpmode > img, #lb.cmpmode .prev, #lb.cmpmode .next { display: none !important; }
  #lb .seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .08); }
  #lb .seg button { position: static; width: auto; height: auto; padding: 4px 12px; border-radius: 6px; font-size: 12px; color: #ccc; background: none; }
  #lb .seg button:hover { color: #fff; }
  #lb .seg button.on { color: #fff; background: rgba(255, 255, 255, .18); }
  .stage { display: flex; justify-content: center; width: 100%; }
  .stage.side { gap: 12px; align-items: flex-start; }
  .stage.side figure { margin: 0; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .stage.side img { max-width: 100%; max-height: calc(100vh - 170px); object-fit: contain; border-radius: 4px; }
  .stage figcaption { color: #ddd; font-size: 12px; }
  @media (max-width: 600px) { .stage.side { flex-direction: column; align-items: center; } .stage.side figure { flex: none; width: 100%; } .stage.side img { max-height: calc((100vh - 200px) / 2); } }
  .sl { position: relative; max-width: 100%; cursor: ew-resize; touch-action: none; user-select: none; }
  .sl img { display: block; max-width: 100%; max-height: calc(100vh - 170px); border-radius: 4px; pointer-events: none; }
  .sl .top { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .sl .hand { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 4px rgba(0, 0, 0, .5); pointer-events: none; }
  .sl .hand::after { content: '‹ ›'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 2px; color: #222; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .4); }
  .sl .lab { position: absolute; top: 8px; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #fff; background: rgba(0, 0, 0, .6); pointer-events: none; }
  .sl .lab.l { left: 8px; } .sl .lab.r { right: 8px; }
  /* 주소 탭 */
  .srv { padding: 10px 0; border-bottom: 1px solid var(--vscode-panel-border); }
  .srv:last-child { border-bottom: 0; }
  .srv .row { align-items: center; justify-content: flex-start; }
  .live { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--vscode-descriptionForeground); opacity: .5; }
  .live.on { background: var(--vscode-charts-green); opacity: 1; }
  .srv .host { font-weight: 500; }
  .srv.off .host { color: var(--vscode-descriptionForeground); }
  .paths { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 0 16px; font-size: 12px; }
  .paths a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: normal; }
  .srv.off .paths a { color: var(--vscode-descriptionForeground); }
  .srv .btn2 { margin-left: 8px; padding: 0 8px; line-height: 20px; font-size: 11px; }
  .srv .row .memo { white-space: nowrap; }

  /* ===== 꾸밈: 색은 Cursor 테마를 따르고, 면 · 선 · 글자 단계만 정한다 ===== */
  :root {
    --surface: color-mix(in srgb, var(--vscode-foreground) 4%, transparent);
    --surface-2: color-mix(in srgb, var(--vscode-foreground) 8%, transparent);
    --line: color-mix(in srgb, var(--vscode-foreground) 10%, transparent);
    --muted: var(--vscode-descriptionForeground);
    --accent: var(--vscode-focusBorder);
    --ok: var(--vscode-charts-green); --bad: var(--vscode-charts-red); --run: var(--vscode-charts-blue);
    --r: 8px;
  }
  body { padding: 0 16px 32px; }
  header { padding-top: 14px; }
  .title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  nav { border-bottom-color: var(--line); }
  #colbtn { border-color: var(--line); }
  /* 탭: 아이콘 + 이름. 좁으면 고른 탭만 이름을 보인다 */
  nav button { display: inline-flex; align-items: center; gap: 0; padding: 6px 8px 9px; }
  /* 이름 · 숫자는 너비와 투명도로 펼치고 접는다(좁은 폭에서 탭을 바꿀 때 툭 튀지 않게) */
  nav button .lb, nav button .n { max-width: 120px; margin-left: 6px; overflow: hidden; white-space: nowrap; transition: max-width .26s cubic-bezier(.2, .8, .2, 1), margin-left .26s cubic-bezier(.2, .8, .2, 1), opacity .2s ease; }
  nav button .ti { display: flex; opacity: .8; }
  nav button.on .ti { opacity: 1; color: var(--accent); }
  nav .n { margin-left: 0; padding: 1px 6px; font-weight: 500; background: var(--surface-2); color: var(--muted); }
  nav button.on .n { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--vscode-foreground); }
  /* 좁으면 안 고른 탭은 아이콘만. 숫자 대신, 확인할 게 있는 탭(안 읽은 보고 · 실행 중)에만 점 */
  @media (max-width: 959px) {
    #tabs { gap: 0; }
    #tabs button:not(.on) .lb, #tabs button:not(.on) .n:not(.alert) { max-width: 0; margin-left: 0; opacity: 0; }
    #tabs button:not(.on) .n.alert { margin-left: 0; transition: none; position: absolute; top: 4px; right: 3px; width: 6px; height: 6px; padding: 0; font-size: 0; border-radius: 3px; background: var(--run); }
    #tabs button { position: relative; }
  }
  main { padding-top: 18px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  h3 { font-size: 12px; font-weight: 500; margin: 24px 0 8px; color: var(--muted); }
  main > h3:first-child, main > .muted:first-child + h3 { margin-top: 0; }
  .memo { margin-top: 1px; }
  /* 목록은 옅은 면 카드 하나로 묶고, 안은 선 한 겹으로 나눈다 */
  main ul:not(.md *), .card { margin: 0; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  main li:not(.md *) { padding: 10px 0; border-bottom-color: var(--line); }
  #tablist li { padding: 6px 14px; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); }
  .bar i { border-radius: 3px; }
  .mini { height: 4px; background: var(--surface-2); }
  .mini i { border-radius: 2px; }
  .num { font-size: 12px; color: var(--muted); }
  /* 배지: 옅은 면 + 같은 계열 글자 */
  .badge { font-weight: 500; background: var(--surface-2); color: var(--vscode-foreground); }

const empty = (k, text) => '<div class="empty"><span class="eic">' + SVG(k, 22, true) + '</span><p>' + text + '</p></div>'
// 진행판 상태 아이콘: 끝남은 채운 원 + 체크, 지금 할 것은 강조 링, 나머지는 빈 원
const DONE = '<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--ok)"/><path d="m8 12 3 3 5-6" fill="none" stroke="var(--vscode-sideBar-background, #000)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
const NOW = '<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--accent)" stroke-width="2.4"/><circle cx="12" cy="12" r="3.5" fill="var(--accent)"/></svg>'
const TODO = '<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--muted)" stroke-width="2" opacity=".6"/></svg>'

function parsePlan(text) {
  let goal = ''
  const items = []
  const notes = []
  for (const l of text.split('\n')) {
    let m
    if (!goal && (m = l.match(/^#+\s+(.*)/))) goal = m[1]
    else if ((m = l.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)/))) {
      const [t, ...memo] = m[2].split(' - ')
      items.push({ done: m[1] !== ' ', t, memo: memo.join(' - ') })
    } else if (l.trim()) notes.push(l.trim())
  }
  return { goal, items, notes }
}

function views() {
  const p = parsePlan(d.plan || '')
  const done = p.items.filter(i => i.done).length
  const pct = p.items.length ? Math.round(done / p.items.length * 100) : 0
  const nowAt = p.items.findIndex(i => !i.done)
  const plan = !p.items.length && !p.goal
    ? empty('plan', '아직 진행판이 없어요. 단계가 여럿인 일을 시키면 Claude 가 여기에 목록을 올려요.')

      + p.notes.map(n => '<p class="muted">' + esc(n) + '</p>').join('')

  const u = d.usage && d.usage.context
  // mod 기록이 있으면 그 값을 쓴다. 없으면 창 크기를 모델 이름으로 어림한다(haiku 200K, 그 밖은 1M)
  const win = u && u.window || (c && /haiku/.test(c.model) ? 200000 : 1000000)

  }).sort((a, b) => (a.kind === 'used' ? 0 : 1) - (b.kind === 'used' ? 0 : 1) || b.tokens - a.tokens)

      + (a.status === 'running' && a.now ? '<span class="now"><i class="pulse"></i><span>' + esc(a.now) + '</span></span>' : '') + '</span><span><span class="badge ' + a.status + '">' + (STATUS[a.status] || esc(a.status)) + '</span></span><span class="chev">›</span></li>').join('') + '</ul>'

  const rel = p => d.cwd && p.startsWith(d.cwd + '/') ? p.slice(d.cwd.length + 1) : p.replace(/^\/Users\/[^/]+/, '~')
  const files = !d.files.length ? empty('files', '이 세션에서 바꾼 파일이 없어요.')

  const dur = ms => { const sec = Math.round(ms / 1000); return sec < 60 ? sec + '초' : Math.floor(sec / 60) + '분 ' + (sec % 60) + '초' }
  const codexList = d.codex || []
  // Codex 한도는 계정 단위라 이 세션이 시킨 일이 없어도 보여 준다

  const WIN = { 300: '5시간 한도', 10080: '주간 한도' }

  const PLAN = {

  // 검사는 종류별로 마지막 결과만. 여러 번 돌렸으면 횟수
  const checkList = r => { const m = new Map(); for (const c of r.checks || []) { const x = m.get(c.kind) || { kind: c.kind, n: 0 }; x.n++; x.ok = c.ok; x.cmd = c.cmd; m.set(c.kind, x) } return [...m.values()] }
  const checkSum = r => { const l = checkList(r); if (!l.length) return ''; const bad = l.filter(x => x.ok === false).length; return bad ? '<span class="badge failed">검사 ' + bad + '개 실패</span>' : l.every(x => x.ok) ? '<span class="badge done">검사 통과</span>' : '' }
  const bundle = r => {
    const rows = []
    if (r.files && r.files.length) rows.push('<span class="k">바뀐 파일</span><span class="v">' + r.files.map(f => '<a class="chip" data-open="' + esc(f) + '" title="' + esc(rel(f)) + '">' + esc(f.split('/').pop()) + '</a>').join('') + '</span>')
    const ok = (r.shots || []).filter(x => !x.gone)
    if (ok.length) rows.push('<span class="k">캡처</span><span class="v">' + ok.map(x => { shots.push({ ...x, caption: r.ask }); return '<button class="shot" data-shot="' + (shots.length - 1) + '" title="' + esc(x.p.split('/').pop()) + '"><img loading="lazy" src="' + esc(x.uri) + '" alt=""></button>' }).join('') + '</span>')
    const cl = checkList(r)
    if (cl.length) rows.push('<span class="k">검사</span><span class="v">' + cl.map(x => '<span class="badge ' + (x.ok === false ? 'failed' : x.ok ? 'done' : 'running') + '" title="' + esc(x.cmd) + '">' + x.kind + (x.ok === false ? ' 실패' : x.ok ? ' 통과' : ' 도는 중') + (x.n > 1 ? ' · ' + x.n + '번' : '') + '</span>').join('') + '</span>')
    return rows.length ? '<div class="tb">' + rows.join('') + '</div>' : ''
  }
  const plain = t => t.replace(/```[\s\S]*?```/g, ' ').replace(/[#*`|>_-]+/g, ' ').replace(/\s+/g, ' ').trim()
  const reps = (d.reports || []).filter(r => showAll || r.tools > 0)
  const unread = reps.filter(r => !read.has(r.id)).length
  const rep = '<div class="reptop"><label class="sw"><input type="checkbox" data-allrep' + (showAll ? ' checked' : '') + '> 말로만 답한 것도 보기</label></div>'
    + (!reps.length ? empty('rep', '아직 결과보고가 없어요. Claude 가 일을 마치고 답하면 여기 쌓여요.')
    : '<div class="card">' + reps.map(r => {
      const key = 'rep:' + r.id
      return '<div class="rep exp' + (opened.has(key) ? ' open' : '') + '"><div class="exp-head" data-exp="' + esc(key) + '" data-rep="' + esc(r.id) + '">'
        + (read.has(r.id) ? '<span class="readpad"></span>' : '<span class="unread" title="안 읽음"></span>')
        + '<span class="grow"><span class="t one">' + (r.by === 'agent' ? '<span class="badge by">에이전트 완료 뒤</span>' : '') + esc(r.ask || '요청 없음') + '</span>'
        + '<span class="memo">' + ago(r.at) + (r.tools ? ' · 도구 ' + r.tools + '번' : '') + (r.files && r.files.length ? ' · 파일 ' + r.files.length + '개' : '') + (r.shots && r.shots.length ? ' · 캡처 ' + r.shots.length + '장' : '') + checkSum(r) + '</span><span class="peek">' + esc(plain(r.text).slice(0, 300)) + '</span></span><span class="chev">›</span></div>'
        + '<div class="exp-body"><div>' + bundle(r) + (r.html ? '<div class="md">' + r.html + '</div>' : '<pre>' + esc(r.text) + '</pre>') + '</div></div></div>'
    }).join('') + '</div>')

  // 내 컴퓨터 주소는 지금 사내 IP 로 바꿔 열 수 있게
  const lan = o => d.lanIp && /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0)(:|$)/.test(o) ? o.replace(/\/\/[^:/]+/, '//' + d.lanIp) : ''
  // 주소: 서버(포트)별로 묶고 켜진 것을 위로
  const srv = new Map()
  for (const u of d.urls || []) {
    if (!srv.has(u.origin)) srv.set(u.origin, { origin: u.origin, live: u.live, at: u.at, paths: [] })
    const pth = u.url.slice(u.origin.length)
    if (pth) srv.get(u.origin).paths.push(u.url)
  }
  const servers = [...srv.values()]
  const srvRow = x => {
    const st = x.live === true ? '켜짐' : x.live === false ? '꺼짐' : '확인 중'
    return '<div class="srv' + (x.live === true ? '' : ' off') + '"><div class="row"><span class="live' + (x.live === true ? ' on' : '') + '" title="' + st + '"></span>'
      + '<a class="host" data-url="' + esc(x.origin) + '">' + esc(x.origin.replace(/^https?:\/\//, '')) + '</a><span class="grow"></span><span class="memo">' + st + (x.at ? ' · ' + ago(x.at) + ' 언급' : '') + '</span>'
      + (lan(x.origin) ? '<button class="btn2" data-url="' + esc(lan(x.origin)) + '" title="' + esc(lan(x.origin)) + '">사내 IP로 열기</button>' : '') + '</div>'
      + (x.paths.length ? '<div class="paths">' + x.paths.slice(0, 4).map(p => '<a data-url="' + esc(p) + '" title="' + esc(p) + '">' + esc(p.slice(x.origin.length)) + '</a>').join('') + (x.paths.length > 4 ? '<span class="muted">외 ' + (x.paths.length - 4) + '개</span>' : '') + '</div>' : '')
      + '</div>'
  }
  const on = servers.filter(x => x.live === true), off = servers.filter(x => x.live !== true)
  const urls = !servers.length ? empty('urls', '이 세션에 나온 미리보기 주소가 없어요. localhost · 사내 IP · 미리보기 도메인 주소가 나오면 여기 모여요.')
    : (on.length ? '<h3 style="margin-top:0">켜져 있음</h3><div class="card">' + on.map(srvRow).join('') + '</div>' : '')
      + (off.length ? '<h3' + (on.length ? '' : ' style="margin-top:0"') + '>꺼져 있음</h3><div class="card">' + off.map(srvRow).join('') + '</div>' : '')

  return { plan, rep, ctx, agents, files, codex, out, urls, counts: { urls: on.length || '', rep: unread || '', out: groups.reduce((n, g) => n + g.files.length, 0) || '', plan: p.items.length ? done + '/' + p.items.length : '', ctx: c ? cpct + '%' : '', agents: d.agents.filter(a => a.status === 'running').length || '', files: d.files.length || '', codex: codexList.filter(r => r.status === 'running').length || '' } }
}

// 펼친 항목(결과보고·코덱스). 다시 그려도 그대로 열려 있게
const opened = new Set()
// 다시 그려도 쓰던 글과 스위치가 남도록 따로 들고 있는다
const drafts = new Map(), writes = new Set()
document.addEventListener('input', e => {
  if (e.target.dataset.draft) drafts.set(e.target.dataset.draft, e.target.value)
  if ('allrep' in e.target.dataset) { showAll = e.target.checked; save(); draw() }
  if (e.target.dataset.write) e.target.checked ? writes.add(e.target.dataset.write) : writes.delete(e.target.dataset.write)
})
function sendCx(file) {
  const text = (drafts.get(file) || '').trim()
  if (!text) return
  vscode.postMessage({ codexSend: { file, text, write: writes.has(file) } })
  drafts.delete(file)
  draw()
}
document.addEventListener('keydown', e => {
  if (e.target.dataset && e.target.dataset.draft && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendCx(e.target.dataset.draft) }
})
// 펼치고 접을 때는 그 항목만 class 를 바꿔 애니메이션이 보이게 하고, 숫자는 끝난 뒤 다시 그린다
let redrawTimer = null
document.addEventListener('click', e => {
  const hd = e.target.closest('[data-exp]')
  if (!hd) return
  const box = hd.closest('.exp'), key = hd.dataset.exp, open = !opened.has(key)
  open ? opened.add(key) : opened.delete(key)
  box.classList.toggle('open', open)
  if (hd.dataset.rep && !read.has(hd.dataset.rep)) {
    read.add(hd.dataset.rep)
    save()
    const dot = hd.querySelector('.unread')
    if (dot) dot.className = 'readpad'
  }
  clearTimeout(redrawTimer)
  redrawTimer = setTimeout(draw, 320)
})

function placeInd() {
  const on = document.querySelector('#tabs .on'), ind = document.getElementById('ind'), tabs = document.getElementById('tabs')
  if (!on) return
  ind.style.width = on.offsetWidth + 'px'
  ind.style.transform = 'translateX(' + (on.offsetLeft - tabs.scrollLeft) + 'px)'
}
document.getElementById('tabs').addEventListener('scroll', placeInd)
// 이름 너비가 바뀌는 0.3초 동안 밑줄 위치를 매 장면 다시 잰다
let indUntil = 0
function followInd() {
  const go = !indUntil
  indUntil = performance.now() + 320
  placeInd()
  if (go) requestAnimationFrame(function f(t) { placeInd(); if (t < indUntil) requestAnimationFrame(f); else indUntil = 0 })
}

const TABS = [['plan', '진행판'], ['rep', '결과보고'], ['ctx', '컨텍스트'], ['agents', '에이전트'], ['codex', '코덱스'], ['out', '결과물'], ['urls', '주소'], ['files', '바뀐 파일']]
// 내가 정한 순서대로. 순서에 없는 새 탭은 뒤에 붙는다
const ordered = () => TABS.slice().sort((a, b) => {
  const i = order.indexOf(a[0]), j = order.indexOf(b[0])
  return (i < 0 ? 99 : i) - (j < 0 ? 99 : j)
})

// 끌어서 순서 바꾸기(탭 줄 가로, 메뉴 세로 공용): 잡은 것은 커서를 따라가고, 나머지는 비켜서며 미끄러진다
let drag = null, justDragged = false
function sortable(list, { axis, handle, start, end }) {
  const X = axis === 'x'
  const pos = e => X ? e.clientX : e.clientY
  const off = el => X ? el.offsetLeft : el.offsetTop
  const edge = r => X ? [r.left, r.right] : [r.top, r.bottom]
  list.addEventListener('pointerdown', e => {
    const item = e.target.closest('[data-key]')
    if (!item || e.button !== 0 || (handle && !e.target.closest(handle))) return
    drag = { list, item, p: pos(e), o: off(item), moved: false, id: e.pointerId }
    if (handle) e.preventDefault()
  })
  window.addEventListener('pointermove', e => {
    if (!drag || drag.list !== list || e.pointerId !== drag.id) return
    const d = pos(e) - drag.p
    if (!drag.moved) {
      if (Math.abs(d) < 5) return
      drag.moved = true
      list.setPointerCapture(e.pointerId)
      drag.item.classList.add('dragging')
      drag.item.style.transition = 'none'
      if (start) start()
    }
    const items = [...list.children], c = pos(e)
    const target = items.find(b => { if (b === drag.item) return false; const [a1, a2] = edge(b.getBoundingClientRect()); return c > a1 && c < a2 })
    if (target) {
      const [a1, a2] = edge(target.getBoundingClientRect()), ref = c > (a1 + a2) / 2 ? target.nextSibling : target
      if (ref !== drag.item && ref !== drag.item.nextSibling) {
        const before = new Map(items.map(b => [b, edge(b.getBoundingClientRect())[0]]))
        list.insertBefore(drag.item, ref)
        for (const b of items) {
          if (b === drag.item) continue
          const d0 = before.get(b) - edge(b.getBoundingClientRect())[0]
          if (!d0) continue
          b.style.transition = 'none'
          b.style.transform = (X ? 'translateX(' : 'translateY(') + d0 + 'px)'
          requestAnimationFrame(() => { b.style.transition = 'transform .2s cubic-bezier(.2, .8, .2, 1)'; b.style.transform = '' })
        }
      }
    }
    drag.item.style.transform = (X ? 'translateX(' : 'translateY(') + (d - (off(drag.item) - drag.o)) + 'px)'
  })
  window.addEventListener('pointerup', e => {
    if (!drag || drag.list !== list || e.pointerId !== drag.id) return
    const { item, moved } = drag
    drag = null
    if (!moved) return
    justDragged = true
    setTimeout(() => { justDragged = false }, 0)
    // 놓으면 제자리로 살짝 미끄러져 들어간다
    item.style.transition = 'transform .2s cubic-bezier(.2, .8, .2, 1)'
    item.style.transform = ''
    item.classList.remove('dragging')
    end([...list.children].map(b => b.dataset.key))
  })
}

const tabsEl = document.getElementById('tabs')
sortable(tabsEl, {
  axis: 'x',
  start: () => { document.getElementById('ind').style.opacity = '0' },
  // 탭 줄에는 숨긴 탭이 없으니, 숨긴 탭은 원래 자리 순서를 지키며 뒤에 붙인다
  end: keys => { order = keys.concat(ordered().map(([k]) => k).filter(k => !keys.includes(k))); save(); setTimeout(() => { document.getElementById('ind').style.opacity = ''; draw(); renderMenu() }, 220) },
})

// 탭 고르기 메뉴
const menu = document.getElementById('tabmenu'), colbtn = document.getElementById('colbtn'), tablist = document.getElementById('tablist')
const GRIP = '<svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M192,16H64A16,16,0,0,0,48,32V224a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V32A16,16,0,0,0,192,16ZM100,200a12,12,0,1,1,12-12A12,12,0,0,1,100,200Zm0-60a12,12,0,1,1,12-12A12,12,0,0,1,100,140Zm0-60a12,12,0,1,1,12-12A12,12,0,0,1,100,80Zm56,120a12,12,0,1,1,12-12A12,12,0,0,1,156,200Zm0-60a12,12,0,1,1,12-12A12,12,0,0,1,156,140Zm0-60a12,12,0,1,1,12-12A12,12,0,0,1,156,80Z"/></svg>'
function renderMenu() {
  document.getElementById('mh').innerHTML = '<div class="mrow"><span>표시할 탭</span><label class="sw"><input type="checkbox" id="own"' + (own() ? ' checked' : '') + (sid ? '' : ' disabled') + '> 이 세션만 따로</label></div>'
    + (own() ? '<div class="mnote">이 세션만 따로 쓰는 중이에요. 끄면 공통 설정으로 돌아가요.</div>' : '')
  const shown = ordered().filter(([k]) => !hidden.has(k)).length
  tablist.innerHTML = ordered().map(([k, n]) => {
    const on = !hidden.has(k), last = on && shown === 1
    return '<li data-key="' + k + '"><span class="grip" title="끌어서 순서 바꾸기">' + GRIP + '</span><label><input type="checkbox" data-show="' + k + '"' + (on ? ' checked' : '') + (last ? ' disabled title="탭은 하나 이상 보여야 해요"' : '') + '> ' + n + '</label></li>'
  }).join('')
}
sortable(tablist, { axis: 'y', handle: '.grip', end: keys => { order = keys; save(); draw() } })
const setMenu = on => { menu.classList.toggle('on', on); colbtn.classList.toggle('on', on); colbtn.setAttribute('aria-expanded', on) }
colbtn.addEventListener('click', () => { if (!menu.classList.contains('on')) renderMenu(); setMenu(!menu.classList.contains('on')) })
document.addEventListener('click', e => { if (menu.classList.contains('on') && !e.target.closest('#tabmenu, #colbtn')) setMenu(false) })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('on')) setMenu(false) })
document.getElementById('mh').addEventListener('change', e => {
  if (e.target.id !== 'own' || !sid) return
  // 켜면 지금 공통 설정을 복사해 시작하고, 끄면 이 세션 설정을 지운다
  if (e.target.checked) per[sid] = { order: order.slice(), hidden: [...hidden] }
  else delete per[sid]
  loadCfg(); save(); renderMenu(); draw()
})
tablist.addEventListener('change', e => {
  const k = e.target.dataset.show
  if (!k) return
  e.target.checked ? hidden.delete(k) : hidden.add(k)
  save(); renderMenu(); draw()
})
menu.querySelector('[data-reset]').addEventListener('click', () => { order = []; hidden.clear(); save(); renderMenu(); draw() })
function draw() {
  if (!d) return
  // 저장해 둔 탭이 빠진 탭이면 진행판으로
  const visible = ordered().filter(([k]) => !hidden.has(k))
  if (!visible.some(([k]) => k === tab)) tab = visible[0][0]
  const v = views()
  document.getElementById('title').textContent = d.label
  // 끄는 중에는 탭 줄을 다시 그리지 않는다
  if (!drag) {
    const html = visible.map(([k, n]) => '<button data-tab="' + k + '" data-key="' + k + '" title="' + n + '"><span class="ti">' + SVG(k, 16, true) + '</span><span class="lb">' + n + '</span>' + (v.counts[k] ? '<span class="n' + (['rep', 'agents', 'codex'].includes(k) ? ' alert' : '') + '">' + v.counts[k] + '</span>' : '') + '</button>').join('')
    const box = document.getElementById('tabs')
    if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html }
    box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab))
  }
  const f = document.activeElement, keep = f && f.dataset && f.dataset.draft ? [f.dataset.draft, f.selectionStart, f.selectionEnd] : null
  document.getElementById('main').innerHTML = v[tab]
  if (keep) {
    const t = [...document.querySelectorAll('[data-draft]')].find(x => x.dataset.draft === keep[0])
    if (t && !t.disabled) { t.focus(); t.setSelectionRange(keep[1], keep[2]) }
  }
  const on = document.querySelector('#tabs .on')
  on.scrollIntoView({ block: 'nearest', inline: 'nearest' })
  followInd()
  edges()
}

// 겹쳐 뜨는 스크롤 막대: 굴리는 그 영역 오른쪽에 잠깐 보인다
const bar = document.getElementById('thumbbar'), fade = document.getElementById('fade')
let barTimer = null
function edges() {
  const r = document.scrollingElement
  fade.classList.toggle('on', r.scrollHeight - r.scrollTop - r.clientHeight > 4)
  document.querySelectorAll('.md, pre').forEach(el => el.classList.toggle('more', el.scrollHeight - el.scrollTop - el.clientHeight > 4))
}
document.addEventListener('scroll', e => {
  const el = e.target === document ? document.scrollingElement : e.target
  if (!el || el.id === 'tabs' || el.scrollHeight <= el.clientHeight) return
  const box = el === document.scrollingElement ? { top: 0, right: innerWidth, height: innerHeight } : el.getBoundingClientRect()
  const h = Math.max(24, box.height * el.clientHeight / el.scrollHeight)
  bar.style.height = h + 'px'
  bar.style.left = (box.right - 8) + 'px'
  bar.style.top = (box.top + (box.height - h) * el.scrollTop / (el.scrollHeight - el.clientHeight)) + 'px'
  bar.classList.add('on')
  clearTimeout(barTimer)
  barTimer = setTimeout(() => bar.classList.remove('on'), 700)
  edges()
}, true)
addEventListener('resize', edges)

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]')
  if (b && !justDragged) { tab = b.dataset.tab; save(); draw() }
  const a = e.target.closest('[data-open]')
  if (a) vscode.postMessage({ open: a.dataset.open })
  // 마크다운 안의 파일 링크(/경로:줄)는 Cursor 에서 연다
  const ml = e.target.closest('.md a[href]')
  if (ml) {
    e.preventDefault()
    const href = decodeURI(ml.getAttribute('href'))
    if (href.startsWith('/')) vscode.postMessage({ open: href.replace(/:\d+(:\d+)?$/, '') })
    else if (/^https?:/.test(href)) vscode.postMessage({ url: href })
  }
  const sb = e.target.closest('[data-send]')
  if (sb && !sb.disabled) sendCx(sb.dataset.send)
  const u = e.target.closest('[data-url]')
  if (u) vscode.postMessage({ url: u.dataset.url })
  const pk = e.target.closest('[data-pick]')
  if (pk) { pick = pk.dataset.pick === 'on' ? [] : null; draw() }
  const t = e.target.closest('[data-shot]')
  if (t && pick) {
    const f = shots[+t.dataset.shot], i = pick.indexOf(f.p)
    i >= 0 ? pick.splice(i, 1) : pick.push(f.p)
    if (pick.length === 2) { const [a, b] = pick.map(p => shots.find(x => x.p === p)); pick = null; draw(); openCmp(a, b) }
    else draw()
  } else if (t) show(+t.dataset.shot)
  const cp = e.target.closest('[data-copy]')
  if (cp) copyImg(cp.dataset.copy)
  const cm = e.target.closest('[data-cm]')
  if (cm) { if (cm.dataset.cm === 'swap') cmp.reverse(); else cmpMode = cm.dataset.cm; drawCmp() }
  const l = e.target.closest('[data-lb]')
  if (l) l.dataset.lb === 'close' ? hide() : step(l.dataset.lb === 'next' ? 1 : -1)
  // 경계선을 끌다 놓은 클릭으로는 닫지 않는다
  else if ((e.target.id === 'lb' || e.target.classList.contains('stage')) && Date.now() - slidAt > 300) hide()
})

// 라이트박스: 이 탭의 이미지를 한 줄로 이어 좌우로 넘긴다
let shots = [], at = -1
const lb = document.getElementById('lb')
function show(i) {
  if (!shots.length) return
  at = (i + shots.length) % shots.length
  const f = shots[at]
  lb.querySelector('img').src = f.uri
  lb.querySelector('.meta').innerHTML = (f.caption ? esc(f.caption) + '<br>' : '') + (at + 1) + ' / ' + shots.length + ' · <a data-open="' + esc(f.p) + '">' + esc(f.p.split('/').pop()) + ' 열기</a> · <a data-copy="' + esc(f.p) + '" title="Cmd+C">복사</a>'
  lb.querySelectorAll('.prev, .next').forEach(b => b.style.display = shots.length > 1 ? '' : 'none')
  lb.classList.add('on')
}
function hide() { lb.classList.remove('on', 'cmpmode'); at = -1; cmp = null }
// 이미지 복사는 확장이 한다(웹뷰는 클립보드에 이미지를 못 넣는다). 답이 오면 글자로 알린다
function copyImg(p) {
  const a = lb.querySelector('[data-copy]')
  if (a) a.textContent = '복사 중'
  vscode.postMessage({ copyImage: p })
}
// 두 장 비교: 나란히 또는 겹쳐 놓고 경계선을 밀어 본다
let pick = null, cmp = null, cmpX = 50, cmpMode = 'slide'
function openCmp(a, b) { cmp = [a, b]; cmpX = 50; lb.classList.add('on', 'cmpmode'); drawCmp() }
function drawCmp() {
  const [a, b] = cmp, nm = f => esc(f.p.split('/').pop())
  const seg = '<div class="seg">' + [['slide', '겹쳐 밀기'], ['side', '나란히']].map(([k, n]) => '<button data-cm="' + k + '" class="' + (cmpMode === k ? 'on' : '') + '">' + n + '</button>').join('') + '<button data-cm="swap">전후 바꾸기</button></div>'
  const stage = cmpMode === 'side'
    ? '<div class="stage side"><figure><img src="' + esc(a.uri) + '" alt=""><figcaption>전 · ' + nm(a) + '</figcaption></figure><figure><img src="' + esc(b.uri) + '" alt=""><figcaption>후 · ' + nm(b) + '</figcaption></figure></div>'
    : '<div class="stage"><div class="sl"><img src="' + esc(a.uri) + '" alt=""><img class="top" src="' + esc(b.uri) + '" alt=""><span class="hand"></span><span class="lab l">전</span><span class="lab r">후</span></div></div>'
  lb.querySelector('.cmp').innerHTML = seg + stage
  lb.querySelector('.meta').innerHTML = cmpMode === 'side' ? '' : '전 · ' + nm(a) + ' &nbsp; 후 · ' + nm(b) + '<br><span style="color:#999">끌거나 ← → 키로 경계선을 옮겨요</span>'
  setX(cmpX)
}
function setX(x) {
  cmpX = Math.max(0, Math.min(100, x))
  const sl = lb.querySelector('.sl')
  if (!sl) return
  sl.querySelector('.top').style.clipPath = 'inset(0 0 0 ' + cmpX + '%)'
  sl.querySelector('.hand').style.left = cmpX + '%'
}
let sliding = false, slidAt = 0
const slideTo = e => { const r = lb.querySelector('.sl').getBoundingClientRect(); setX((e.clientX - r.left) / r.width * 100) }
lb.addEventListener('pointerdown', e => { if (!e.target.closest('.sl')) return; sliding = true; slideTo(e) })
window.addEventListener('pointermove', e => { if (sliding) slideTo(e) })
window.addEventListener('pointerup', () => { if (sliding) { sliding = false; slidAt = Date.now() } })
function step(n) { show(at + n) }
document.addEventListener('keydown', e => {
  if (cmp) {
    if (e.key === 'Escape') hide()
    else if (e.key === 'ArrowRight') setX(cmpX + 5)
    else if (e.key === 'ArrowLeft') setX(cmpX - 5)
    return
  }
  if (e.key === 'Escape' && pick) { pick = null; draw(); return }
  if (at < 0) return
  if (e.key === 'c' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); copyImg(shots[at].p) }
  else if (e.key === 'Escape') hide()
  else if (e.key === 'ArrowRight') step(1)
  else if (e.key === 'ArrowLeft') step(-1)
})

// 에이전트 자세히 보기: 가운데 큰 창. 여는 동안 확장이 바뀔 때마다 다시 보낸다
const am = document.getElementById('am')
let amData = null, amId = null, amPrompt = false
const amOpen = new Set()
const hm = t => t ? new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : ''
function openAm(id) { amId = id; amData = null; am.querySelector('.bd').scrollTop = 0; amOpen.clear(); amPrompt = false; drawAm(); am.classList.add('on'); vscode.postMessage({ agentDetail: id }) }
function closeAm() { am.classList.remove('on'); amId = null; vscode.postMessage({ agentDetail: null }) }
function drawAm() {
  const a = amData && amData.id === amId ? amData : null
  const row = (d && d.agents || []).find(x => x.id === amId) || {}
  const st = (a && a.status) || row.status
  am.querySelector('.hd').innerHTML = '<div class="grow"><h2>' + esc((a || row).name || '') + '</h2><span class="memo">' + esc((a || row).type || '') + ((a || row).model ? ' · ' + esc((a || row).model) : '') + (a ? ' · 도구 ' + a.tools + '번' : '') + (a && a.start ? ' · ' + hm(a.start) + ' 시작' : '') + '</span></div><span class="badge ' + st + '">' + (STATUS[st] || esc(st || '')) + '</span><button class="x" data-am="close" aria-label="닫기">✕</button>'
  const bd = am.querySelector('.bd'), atEnd = bd.scrollHeight - bd.scrollTop - bd.clientHeight < 40, keepTop = bd.scrollTop
  if (!a) { bd.innerHTML = '<p class="muted">기록을 불러오는 중이에요.</p>'; return }
  if (!a.found) { bd.innerHTML = '<p class="muted">이 에이전트의 기록 파일을 찾지 못했어요. 오래된 세션이거나 아직 시작 전일 수 있어요.</p>'; return }
  const steps = a.steps.map((x, i) => {
    const n = a.total - a.steps.length + i
    if (x.k === 'text') return '<div class="st"><div class="tx">' + esc(x.text) + '</div></div>'
    return '<div class="st' + (x.err ? ' err' : '') + (amOpen.has(n) ? ' open' : '') + '"><button class="sh" data-st="' + n + '"><span class="tn" title="' + esc(x.name) + '">' + esc(x.brief.includes(' · ') ? x.brief.split(' · ')[0] : x.name.replace(/^mcp__.*__/, '')) + '</span><span class="br">' + esc(x.brief.includes(' · ') ? x.brief.slice(x.brief.indexOf(' · ') + 3) : '') + '</span><span class="tm">' + hm(x.at) + '</span><span class="chev">›</span></button>'
      + '<div class="sb"><div class="k">입력</div><pre>' + esc(x.input || '') + '</pre>' + (x.result != null ? '<div class="k">' + (x.err ? '오류' : '결과') + '</div><pre' + (x.err ? ' class="bad"' : '') + '>' + esc(x.result || '(비어 있음)') + '</pre>' : '<div class="k">결과 기다리는 중</div>') + '</div></div>'
  }).join('')
  bd.innerHTML = '<h3>받은 지시</h3><div class="prompt' + (amPrompt ? ' full' : '') + '">' + esc(a.prompt || '') + '</div><button class="more" data-am="prompt">' + (amPrompt ? '접기' : '전체 보기') + '</button>'
    + '<h3>한 일 · ' + a.total + '개</h3>' + (a.steps.length < a.total ? '<button class="more" data-am="all" style="margin:0 0 8px">앞부분 ' + (a.total - a.steps.length) + '개 더 보기</button>' : '')
    + '<div class="steps">' + (steps || '<div class="st"><div class="tx muted">아직 한 일이 없어요.</div></div>') + '</div>'
    + (st === 'running' ? '<div class="live"><i class="pulse"></i>일하는 중이에요. 새 동작이 아래에 이어 붙어요.</div>' : '')
    + (a.final || a.finalText ? '<h3>최종 보고</h3><div class="md">' + (a.final || '<div style="white-space:pre-wrap">' + esc(a.finalText) + '</div>') + '</div>' : '')
  // 다시 그려도 보던 자리를 지킨다. 도는 중이고 맨 아래를 보고 있었으면 새 동작을 따라간다
  bd.scrollTop = atEnd && st === 'running' ? bd.scrollHeight : keepTop
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-agent]')
  if (g && g.dataset.agent) return openAm(g.dataset.agent)
  const b = e.target.closest('[data-am]')
  if (b) {
    if (b.dataset.am === 'close') closeAm()
    if (b.dataset.am === 'prompt') { amPrompt = !amPrompt; drawAm() }
    if (b.dataset.am === 'all') vscode.postMessage({ agentDetail: amId, all: true })
    return
  }
  const t = e.target.closest('#am [data-st]')
  if (t) { const n = +t.dataset.st; amOpen.has(n) ? amOpen.delete(n) : amOpen.add(n); t.parentElement.classList.toggle('open') }
  else if (e.target === am) closeAm()
})
document.addEventListener('keydown', e => { if (e.key === 'Escape' && am.classList.contains('on')) closeAm() })
window.addEventListener('message', e => {
  const m = e.data
  if (m.agentDetail) { amData = m.agentDetail; if (am.classList.contains('on')) drawAm(); return }
  if ('copied' in m) {
    const a = lb.querySelector('[data-copy]')
    if (a && a.dataset.copy === m.copied) { a.textContent = m.ok ? '복사했어요' : '복사하지 못했어요'; setTimeout(() => { a.textContent = '복사' }, 1500) }
    return
  }
  if (m.loading || m.empty) {
    d = null
    document.getElementById('title').textContent = m.loading || 'Claude 진행판'
    document.getElementById('tabs').innerHTML = ''; document.getElementById('tabs').dataset.html = ''
    document.getElementById('ind').style.width = '0'
    document.getElementById('main').innerHTML = '<p class="muted">' + esc(m.empty || '세션 기록을 읽는 중이에요. 큰 세션은 몇 초 걸려요.') + '</p>'
    return
  }
  d = m
  // 세션이 바뀌면 그 세션 설정(없으면 공통)을 불러온다
  if (d.sid !== sid) { sid = d.sid; loadCfg(); if (menu.classList.contains('on')) renderMenu() }
  // 세션을 처음 볼 때 이미 있던 보고는 읽은 것으로 친다. 그 뒤에 생긴 것만 안 읽음
  if (!seen.has(d.label)) { seen.add(d.label); (d.reports || []).forEach(r => read.add(r.id)); save() }
  draw()
})
setInterval(draw, 60000)
vscode.postMessage({ ready: true })
</script>
</body></html>
